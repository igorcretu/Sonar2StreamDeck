<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Sonar Game Device</title>
  <link rel="stylesheet" href="../../static/css/sdpi.css" />
  <style>
    .ch-buttons { display:flex; flex-wrap:wrap; gap:6px; padding:4px 0 6px; }
    .ch-btn {
      background:#1e293b; color:#94a3b8; border:1px solid #334155;
      padding:5px 10px; border-radius:4px; cursor:pointer; font-size:12px;
    }
    .ch-btn.active { background:#2563eb; color:#fff; border-color:#1d4ed8; }

    .device-row { display:flex; align-items:center; gap:8px; padding:4px 0; border-bottom:1px solid #1e293b; }
    .device-row:last-child { border-bottom:none; }
    .device-thumb {
      width:40px; height:40px; flex-shrink:0;
      background:#111; border:1px solid #334155; overflow:hidden; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
    }
    .device-thumb img { width:100%; height:100%; object-fit:cover; }
    .device-thumb .placeholder { font-size:18px; }
    .device-name { flex:1; color:#cbd5e1; font-size:12px; }
    .device-change { font-size:10px; color:#60a5fa; cursor:pointer; white-space:nowrap; }
    #deviceIconList { min-height:20px; }
    #loadingMsg { color:#475569; font-size:11px; padding:4px 0; }
  </style>
</head>
<body>
  <div class="sdpi-wrapper">

    <div class="sdpi-item">
      <div class="sdpi-item-label">Channels</div>
      <div class="sdpi-item-value">
        <div class="ch-buttons">
          <button class="ch-btn active" data-ch="game">Game</button>
          <button class="ch-btn" data-ch="chatRender">Chat</button>
          <button class="ch-btn" data-ch="media">Media</button>
          <button class="ch-btn" data-ch="aux">Aux</button>
        </div>
      </div>
    </div>

    <div class="sdpi-item" style="flex-direction:column;align-items:flex-start;">
      <div class="sdpi-item-label" style="margin-bottom:4px;">Device Icons</div>
      <div id="loadingMsg">Loading devices…</div>
      <div id="deviceIconList"></div>
    </div>

    <div class="sdpi-item" style="padding:4px 12px;font-size:11px;color:#555;">
      Click a device icon to replace it. Press button to cycle all checked channels.
    </div>

  </div>
  <script src="../../static/utils/common.js"></script>
  <script src="../../static/action.js"></script>
  <script src="index.js"></script>
</body>
</html>
